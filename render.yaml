# NOTE: Render only reads this file from the root of the repository that a
# service is connected to. In this project the backend and frontend each live
# in their own repository (`skillserve-web-backend`, `skillserve-web-frontend`),
# and neither is tracked by this meta-repo — so a service connected to one of
# those repos never sees this Blueprint. To use this file, the connected repo
# must actually contain `backend/` and `frontend/`.
services:
  # ── Backend (Laravel API) ────────────────────────────────────────────
  - type: web
    name: skillserve-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      # NeonDB is an external database, so `fromDatabase` cannot supply it
      # (that property only resolves Render-managed Postgres). The connection
      # is therefore configured explicitly here.
      #
      # DB_HOST must be the bare pooled endpoint. Never paste the connection
      # string, and never append the database name or "?sslmode=..." — libpq
      # treats the whole value as the host and DNS resolution fails.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-bitter-unit-aewcp149-pooler.c-2.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      # Set the remaining three in the Render dashboard for this service, and
      # make sure no stale DB_URL is left behind (it would take precedence).
      # DB_DATABASE must be the database name from your Neon project.
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SANCTUM_EXPIRATION
        value: "1440"
      - key: LOGIN_RATE_LIMIT
        value: "5"
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /up
    autoDeploy: true

  # ── Frontend (Vite build → static) ──────────────────────────────────
  - type: web
    name: skillserve-frontend
    runtime: static
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_REVERB_APP_KEY
        sync: false
      - key: VITE_REVERB_HOST
        sync: false
      - key: VITE_REVERB_PORT
        value: "443"
      - key: VITE_REVERB_SCHEME
        value: https
    routes:
      - type: rewrite
        from: /*
        to: /index.html
